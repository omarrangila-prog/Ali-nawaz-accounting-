<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ali Nawaz Accounting — black rounded tile with a clean geometric "A". -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333a"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- The A: two strokes meeting at the apex, plus the crossbar. -->
  <path d="M19.5 45.5 L32 18 L44.5 45.5"
        fill="none" stroke="#ffffff" stroke-width="5.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 36.2 H39"
        fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round"/>
</svg>
